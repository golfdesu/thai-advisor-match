<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisor Profile - Thai Advisor Match</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 selection:bg-sky-200 selection:text-sky-900">
  
  <!-- Navigation -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group cursor-pointer">
        <div class="bg-gradient-to-tr from-sky-500 to-indigo-600 text-white p-1.5 rounded-lg shadow-sm group-hover:shadow-md transition-all">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <span class="font-bold text-lg bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">Thai Advisor Match</span>
      </a>
      <a href="/" class="text-sm font-semibold text-slate-500 hover:text-sky-600 transition-colors">
        กลับหน้าค้นหา
      </a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loadingState" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-sky-600 mb-4"></div>
      <p class="text-slate-500 font-medium animate-pulse">กำลังโหลดข้อมูลอาจารย์...</p>
    </div>

    <div id="profileContainer" class="hidden space-y-6">
      <!-- Profile Header -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex flex-col md:flex-row gap-6 items-start">
        <div id="avatarContainer" class="shrink-0"></div>
        <div class="flex-1">
          <h1 id="profName" class="text-2xl md:text-3xl font-bold text-slate-900 mb-2"></h1>
          <p id="profRole" class="text-slate-600 font-medium"></p>
          <p id="profUni" class="text-sky-700 text-sm font-semibold mt-1 mb-4"></p>
          
          <div class="flex flex-wrap gap-2" id="actionButtons"></div>
        </div>
      </div>

      <!-- Details Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-6">
          <!-- Research Interests -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="microscope" class="w-5 h-5 text-sky-600"></i>
              ความสนใจและงานวิจัย
            </h2>
            <div id="researchList" class="flex flex-wrap gap-2"></div>
          </div>
          
          <!-- Publications -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="book-open" class="w-5 h-5 text-sky-600"></i>
              ผลงานวิชาการที่โดดเด่น
            </h2>
            <ul id="publicationsList" class="space-y-3"></ul>
          </div>
        </div>

        <div class="space-y-6">
          <!-- Education -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="award" class="w-5 h-5 text-sky-600"></i>
              ประวัติการศึกษา
            </h2>
            <ul id="educationList" class="space-y-3 text-sm text-slate-600"></ul>
          </div>

          <!-- Courses -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i data-lucide="presentation" class="w-5 h-5 text-sky-600"></i>
              วิชาที่สอน
            </h2>
            <ul id="courseList" class="list-disc list-inside space-y-1 text-sm text-slate-600"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Get Faculty ID from URL path (e.g. /faculty/cmu_eng_ee_014)
    const pathParts = window.location.pathname.split('/');
    const facultyId = pathParts[pathParts.length - 1];

    async function loadProfile() {
      try {
        const res = await fetch('/api/v1/faculty/');
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();
        
        const faculty = data.find(f => f.id === facultyId);
        if (!faculty) {
          document.getElementById('loadingState').innerHTML = `
            <div class="text-center">
              <i data-lucide="user-x" class="w-12 h-12 text-slate-400 mx-auto mb-3"></i>
              <h2 class="text-xl font-bold text-slate-800">ไม่พบข้อมูลอาจารย์</h2>
              <a href="/" class="text-sky-600 hover:underline mt-2 inline-block">กลับไปค้นหาใหม่</a>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        renderProfile(faculty);
      } catch (err) {
        console.error(err);
      }
    }

    function renderProfile(f) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('profileContainer').classList.remove('hidden');

      // Header
      document.getElementById('profName').innerText = f.full_name_th || f.full_name;
      document.getElementById('profRole').innerText = f.role || 'คณาจารย์ประจำภาควิชา';
      document.getElementById('profUni').innerText = `${f.department_th || ''} ${f.faculty_th || ''} ${f.university_th || ''}`;

      // Avatar
      const avatarContainer = document.getElementById('avatarContainer');
      if (f.image_url) {
        avatarContainer.innerHTML = `<img src="${f.image_url}" alt="${f.full_name_th}" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl object-cover border-4 border-white shadow-md" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(f.full_name_th)}&background=0284c7&color=fff&size=128'">`;
      } else {
        avatarContainer.innerHTML = `<div class="w-24 h-24 md:w-32 md:h-32 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 text-white flex items-center justify-center font-bold text-3xl shadow-md border-4 border-white">${f.first_name ? f.first_name[0] : '?'}</div>`;
      }

      // Actions
      const actions = document.getElementById('actionButtons');
      if (f.email) {
        actions.innerHTML += `<a href="mailto:${f.email}" class="bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2"><i data-lucide="mail" class="w-4 h-4"></i> ส่งอีเมล</a>`;
      }
      if (f.scholar_url) {
        actions.innerHTML += `<a href="${f.scholar_url}" target="_blank" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2"><i data-lucide="external-link" class="w-4 h-4"></i> ผลงานในฐานข้อมูล</a>`;
      }
      if (f.profile_url) {
        actions.innerHTML += `<a href="${f.profile_url}" target="_blank" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2"><i data-lucide="link" class="w-4 h-4"></i> เว็บไซต์ภาควิชา</a>`;
      }

      // Research Interests
      const researchList = document.getElementById('researchList');
      if (f.research_interests && f.research_interests.length > 0) {
        researchList.innerHTML = f.research_interests.map(i => `<span class="bg-sky-50 text-sky-700 border border-sky-100 px-3 py-1.5 rounded-lg text-sm font-medium">${i}</span>`).join('');
      } else {
        researchList.innerHTML = '<span class="text-slate-400 text-sm">ยังไม่มีข้อมูลความสนใจเพิ่มเติม</span>';
      }

      // Publications
      const pubList = document.getElementById('publicationsList');
      if (f.featured_publications && f.featured_publications.length > 0) {
        pubList.innerHTML = f.featured_publications.map(p => `
          <li class="flex items-start gap-3 p-3 rounded-lg hover:bg-slate-50 transition-colors border border-transparent hover:border-slate-100">
            <i data-lucide="file-text" class="w-5 h-5 text-slate-400 shrink-0 mt-0.5"></i>
            <div>
              <a href="${p.url || '#'}" target="_blank" class="text-sm font-semibold text-slate-800 hover:text-sky-600 leading-tight block">${p.title}</a>
            </div>
          </li>
        `).join('');
      } else {
        pubList.innerHTML = '<li class="text-slate-400 text-sm">ยังไม่มีข้อมูลผลงานวิชาการ</li>';
      }

      // Education
      const eduList = document.getElementById('educationList');
      if (f.education && f.education.length > 0) {
        eduList.innerHTML = f.education.map(e => `
          <li class="flex gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-slate-300 mt-2 shrink-0"></div>
            <span>${e}</span>
          </li>
        `).join('');
      } else {
        eduList.innerHTML = '<li class="text-slate-400">ไม่มีข้อมูลประวัติการศึกษา</li>';
      }

      // Courses
      const courseList = document.getElementById('courseList');
      if (f.taught_courses && f.taught_courses.length > 0) {
        courseList.innerHTML = f.taught_courses.map(c => `<li>${c}</li>`).join('');
      } else {
        courseList.innerHTML = '<li class="text-slate-400 list-none">ไม่มีข้อมูลวิชาที่สอน</li>';
      }

      lucide.createIcons();
    }

    // Load data
    window.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
