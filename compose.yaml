services:
  db:
    image: pgvector/pgvector:pg17
    container_name: thai_educenter_db
    restart: unless-stopped
    # Defaults (128MB shared_buffers) can't hold the faculties HNSW + hot heap,
    # so cold search/taxonomy queries hit disk (0.4-1.1 s first request).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: advisor_match
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advisor_match"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thai_educenter_backend
    restart: unless-stopped
    # API keys (GEMINI_API_KEYS, SERPAPI_KEYS, ...) live in backend/.env.
    # Without this, the container ran with zero Gemini keys and every search
    # silently fell back to keyword matching. Values under `environment:`
    # below override env_file (e.g. DATABASE_URL must point at `db`, not localhost).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/advisor_match
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "true"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8082/api/v1}
    container_name: thai_educenter_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api.localhost:8082/api/v1}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  gateway:
    image: nginx:alpine
    container_name: thai_educenter_gateway
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
